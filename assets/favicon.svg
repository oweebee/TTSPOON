<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- App background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A237E"/>
      <stop offset="100%" style="stop-color:#283593"/>
    </linearGradient>
    <!-- Book cover gradient -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3949AB"/>
      <stop offset="100%" style="stop-color:#1E88E5"/>
    </linearGradient>
    <!-- Book spine gradient -->
    <linearGradient id="bookSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#1976D2"/>
    </linearGradient>
    <!-- Pages gradient -->
    <linearGradient id="pagesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8EAF6"/>
      <stop offset="100%" style="stop-color:#F5F5F5"/>
    </linearGradient>
    <!-- Speaker gradient -->
    <linearGradient id="speakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6F00"/>
      <stop offset="100%" style="stop-color:#FF8F00"/>
    </linearGradient>
    <!-- Drop shadows -->
    <filter id="bookShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="speakerShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App icon background rounded square -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow at top -->
  <ellipse cx="256" cy="60" rx="220" ry="80" fill="white" opacity="0.05"/>

  <!-- ===== BOOK ===== -->
  <!-- Book pages (right side - stack effect) -->
  <rect x="172" y="105" width="202" height="290" rx="4" fill="#DCDFE8" filter="url(#bookShadow)"/>
  <rect x="168" y="102" width="202" height="290" rx="4" fill="#E8EAF6"/>
  <rect x="164" y="99" width="202" height="290" rx="4" fill="#EEF0F8"/>

  <!-- Book cover (main) -->
  <rect x="110" y="96" width="210" height="300" rx="8" fill="url(#bookCover)" filter="url(#bookShadow)"/>

  <!-- Book spine -->
  <rect x="110" y="96" width="36" height="300" rx="8" fill="url(#bookSpine)"/>
  <!-- Spine highlight -->
  <rect x="118" y="96" width="6" height="300" rx="3" fill="white" opacity="0.12"/>

  <!-- Pages visible on right side -->
  <rect x="316" y="102" width="12" height="288" rx="3" fill="url(#pagesGrad)" opacity="0.9"/>
  <!-- Page lines detail -->
  <line x1="316" y1="120" x2="328" y2="120" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="135" x2="328" y2="135" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="150" x2="328" y2="150" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="165" x2="328" y2="165" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="180" x2="328" y2="180" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="200" x2="328" y2="200" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="220" x2="328" y2="220" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="240" x2="328" y2="240" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="260" x2="328" y2="260" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="280" x2="328" y2="280" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="300" x2="328" y2="300" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="320" x2="328" y2="320" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="340" x2="328" y2="340" stroke="#C5CAE9" stroke-width="1.5"/>
  <line x1="316" y1="360" x2="328" y2="360" stroke="#C5CAE9" stroke-width="1.5"/>

  <!-- Cover decoration: horizontal lines (text implication) -->
  <rect x="148" y="160" width="148" height="8" rx="4" fill="white" opacity="0.25"/>
  <rect x="148" y="178" width="120" height="6" rx="3" fill="white" opacity="0.18"/>
  <rect x="148" y="193" width="135" height="6" rx="3" fill="white" opacity="0.18"/>
  <rect x="148" y="208" width="100" height="6" rx="3" fill="white" opacity="0.18"/>

  <!-- Cover title bar at top -->
  <rect x="148" y="120" width="148" height="24" rx="4" fill="white" opacity="0.15"/>
  <rect x="154" y="126" width="90" height="12" rx="3" fill="white" opacity="0.4"/>

  <!-- Cover bottom decoration -->
  <rect x="148" y="340" width="148" height="4" rx="2" fill="white" opacity="0.2"/>
  <rect x="148" y="352" width="80" height="4" rx="2" fill="white" opacity="0.15"/>

  <!-- Cover shine/reflection -->
  <path d="M 120 96 L 200 96 L 200 200 Q 165 160 120 140 Z" fill="white" opacity="0.06"/>

  <!-- ===== SPEAKER BADGE (bottom right) ===== -->
  <!-- Badge circle background with shadow -->
  <circle cx="340" cy="360" r="84" fill="#0D1B5E" opacity="0.5" transform="translate(4,6)"/>
  <circle cx="340" cy="360" r="84" fill="url(#speakerGrad)" filter="url(#speakerShadow)"/>
  <!-- Badge inner highlight ring -->
  <circle cx="340" cy="360" r="84" fill="none" stroke="white" stroke-width="2.5" opacity="0.25"/>
  <!-- Badge subtle radial glow -->
  <radialGradient id="badgeGlow" cx="40%" cy="35%" r="60%">
    <stop offset="0%" style="stop-color:#FFCA28;stop-opacity:0.4"/>
    <stop offset="100%" style="stop-color:#FF6F00;stop-opacity:0"/>
  </radialGradient>
  <circle cx="340" cy="360" r="84" fill="url(#badgeGlow)"/>

  <!-- Speaker icon (Material Design) centered in badge -->
  <!-- Speaker body cone/trapezoid -->
  <path d="M 298 340 L 298 380 L 316 380 L 342 402 L 342 318 L 316 340 Z"
        fill="white" stroke="white" stroke-linejoin="round"/>
  <!-- Sound waves -->
  <!-- Wave 1 (small) -->
  <path d="M 352 348 Q 362 360 352 372"
        fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- Wave 2 (medium) -->
  <path d="M 364 338 Q 382 360 364 382"
        fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- Wave 3 (large) -->
  <path d="M 376 328 Q 402 360 376 392"
        fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
</svg>
